name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the mod jar to (e.g. v0.0.1)"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and attach the mod jar to"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: boxier-mod
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Attach mod jar to release
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          files=(build/libs/*.jar)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No mod jar found in build/libs/"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
